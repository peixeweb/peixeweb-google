name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # A chave do Google Maps e lida do arquivo .env do repositorio
      # (vite.config.ts). Para usar um secret do GitHub no lugar, defina
      # VITE_GOOGLE_MAPS_API_KEY aqui com secrets.VITE_GOOGLE_MAPS_API_KEY.
      - name: Gerar build
        run: npm run build
        env:
          VITE_BASE: /peixeweb-google/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
